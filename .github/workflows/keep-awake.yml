# Render's free plan sleeps after 15 minutes without traffic, and the next visitor waits about a minute.
# Remove this file when the demo no longer needs to be available.
name: Keep demo awake

on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the backend
        run: curl --silent --show-error --fail --retry 3 --retry-delay 30 --retry-all-errors --max-time 90 https://bookmycampus-api.onrender.com/api/health
